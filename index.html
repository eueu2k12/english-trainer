<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#1d2433;--mu:#5d6882;--pr:#2f6fed;--ok:#1f9d55;--bad:#d64545;--bd:#dfe5f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6c2;--pr:#6b9bff;--ok:#43c47c;--bad:#ff7a7a;--bd:#2b3348;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6c2;--pr:#6b9bff;--ok:#43c47c;--bad:#ff7a7a;--bd:#2b3348;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mu);padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:15px}
nav a.on{background:var(--pr);color:#fff;border-color:var(--pr)}
h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:16px 0 8px}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 12px;text-align:center;font-weight:600}
.tile span{display:block;font-size:34px}
button,.btn{font:inherit;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
button.p,.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}
button.on{border-color:var(--pr);color:var(--pr);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0}
textarea{min-height:110px}
.big{font-size:32px;font-weight:700;margin:8px 0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.dig{display:inline-block;font:700 44px/1 ui-monospace,Menlo,Consolas,monospace;background:#1b2233;color:#7dffb0;padding:12px 20px;border-radius:12px;letter-spacing:2px;margin:6px 0}.dig.s{font-size:26px;padding:6px 14px}
.spk{min-height:40px;padding:2px 10px;margin:0 0 0 8px;font-size:20px;vertical-align:middle}.colb{display:inline-flex;align-items:center;gap:8px;border-width:2px}.colb i{width:18px;height:18px;border-radius:50%;display:inline-block}.logo{flex:none;display:inline-block;line-height:0}
.sub{margin:0 0 4px 34px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.txt{background:var(--bg);border-left:4px solid var(--pr);padding:10px 12px;border-radius:8px;font-size:16px;line-height:1.5;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--bd)}.chk input{width:26px;height:26px;min-height:0;margin:0;flex:none}.chk span:first-of-type{flex:1}
@media (max-width:420px){.grid{gap:8px}body{font-size:17px}}
</style>

function pick(){
  const pool=(V.unit=="hardall"?S.words:WP()).filter(w=>(V.unit!="hard"&&V.unit!="hardall")||w.bad>w.ok);
  if(!pool.length){V.w=null;return}
  const wt=pool.map(w=>pool.length>1&&w.id==V.last?0:5-Math.min(w.box,4));
  let r=Math.random()*wt.reduce((a,b)=>a+b,0),i=0;
  while(i<pool.length-1&&r>=wt[i]){r-=wt[i];i++}
  V.w=pool[i];V.res=null;
}
function vokabeln(){
  if(!V.w||!S.words.includes(V.w)||(V.unit!="hardall"&&!wsel(V.w)))pick();
  const opts=`<option value="all">Alle gewählten Wörter</option><option value="hard"${V.unit=="hard"?" selected":""}>Schwierige Wörter</option><option value="hardall"${V.unit=="hardall"?" selected":""}>Meine Fehler (alle Units)</option>`;
  let h=`<h1>Vokabeln</h1><select onchange="V.unit=this.value;pick();render()">${opts}</select>
  <button class="${V.dir=="ed"?"on":""}" onclick="V.dir='ed';V.res=null;render()">Englisch → Deutsch</button><button class="${V.dir=="de"?"on":""}" onclick="V.dir='de';V.res=null;render()">Deutsch → Englisch</button>`;
  const w=V.w;
  if(!w)return h+`<div class="card">Hier gibt es noch keine Wörter. Super, dann gibt es auch keine schwierigen!</div>`;
  const q=V.dir=="ed"?w.en:w.de.split("/")[0],tgt=V.dir=="ed"?w.de:w.en;
  h+=`<div class="card"><div class="mu">Übersetze:</div><div class="big">${esc(q)}${(V.dir=="ed"||V.res)?` <button class="spk" onclick="say(V.w.en)" aria-label="Vorlesen">🔊</button>`:""}</div>
  <input id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort schreiben" ${V.res?"disabled":""} onkeydown="if(event.key=='Enter')${V.res?"next()":"check()"}">`;

  else h+=`<button class="p" onclick="check()">Prüfen</button>`;
  return h+`</div>`;
}
function check(){
  const w=V.w,v=norm($("#ans").value).replace(/^to /,"");if(!v)return;

}

const NW=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const MW={5:"five",10:"ten",20:"twenty",25:"twenty-five"};
const pad=x=>String(x).padStart(2,"0");
function tw(h,m){
  const n=x=>NW[(x-1)%12+1];
  if(m==0)return n(h)+" o'clock";
  if(m==15)return "quarter past "+n(h);
  if(m==30)return "half past "+n(h);
  if(m==45)return "quarter to "+n(h+1);
  return m<30?MW[m]+" past "+n(h):MW[60-m]+" to "+n(h+1);
}
function dig(h,m,s){return `<div class="dig${s?" s":""}">${pad(h)}:${pad(m)}</div>`}
function clk(h,m,sz){
  const P=(a,l)=>{const r=a*Math.PI/180;return[50+l*Math.sin(r),50-l*Math.cos(r)]};
  let t="";
  for(let i=1;i<=12;i++){const p=P(i*30,35);t+=`<text x="${p[0]}" y="${p[1]}" font-size="9" text-anchor="middle" dominant-baseline="central" fill="currentColor">${i}</text>`}
  for(let i=0;i<60;i++){const a=P(i*6,i%5?45:43),b=P(i*6,47);t+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="${i%5?0.4:1}"/>`}
  const H=P(((h%12)+m/60)*30,22),M=P(m*6,32);
  return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" style="color:var(--tx)"><circle cx="50" cy="50" r="48" fill="var(--card)" stroke="currentColor" stroke-width="2"/>${t}<line x1="50" y1="50" x2="${H[0]}" y2="${H[1]}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${M[0]}" y2="${M[1]}" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="currentColor"/></svg>`;
}
function clockQ(lv){
  const ms=lv=="e"?[0,15,30,45]:[0,5,10,15,20,25,30,35,40,45,50,55];
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const T=()=>[1+Math.floor(Math.random()*12),rnd(ms)];
  const [h,m]=T(),D=new Map();let g=0;
  while(D.size<3&&g++<80){let [a,b]=T();if(Math.random()<.5)a=h;else b=m;if(a!=h||b!=m)D.set(a+":"+b,[a,b])}
  const all=sh([[h,m],...D.values()]),w=tw(h,m),kd=Math.floor(Math.random()*3);
  if(kd<2){
    const h24=kd==1&&Math.random()<0.3&&h<12?h+12:h;
    const vis=`<div style="text-align:center">${kd==0?clk(h,m,170):dig(h24,m)}</div>`;
    return{id:h+":"+m,q:"What time is it?",vis,a:w,opts:all.map(x=>tw(x[0],x[1])),e:`${pad(h)}:${pad(m)} = ${w}`,k:"g:Uhrzeit"};
  }
  const an=Math.random()<0.5,key=x=>x[0]+":"+pad(x[1]),ov={};
  all.forEach(x=>{ov[key(x)]=`<span style="display:block;text-align:center">${an?clk(x[0],x[1],110):dig(x[0],x[1],1)}</span>`});
  return{id:h+":"+m,q:`Welche Uhr zeigt „${w}“?`,a:key([h,m]),opts:all.map(key),ov,e:`${w} = ${pad(h)}:${pad(m)}`,k:"g:Uhrzeit"};
}
function clockGo(lv,n){const seen=new Set(),qs=[];let g=0;while(qs.length<n&&g++<600){const q=clockQ(lv);if(!seen.has(q.id)){seen.add(q.id);qs.push(q)}}start(qs,"Uhrzeit")}

/* Wörter verwalten */
function woerter(){
  return `<h1>Wörter</h1><div class="card"><b>Neues Wort</b><input id="ne" placeholder="Englisch" autocapitalize="off"><input id="nd" placeholder="Deutsch (Alternativen mit /)"><input id="nu" placeholder="Unit, z. B. Unit 1" value="Unit 1"><button class="p" onclick="addW()">Hinzufügen</button></div>
  <div class="card"><b>Viele Wörter auf einmal</b><p class="mu">Eine Zeile pro Wort: englisch = deutsch. Tipp: Auf dem iPad lässt sich Text aus einem Foto der Buchseite kopieren (Live Text) und hier einfügen.</p><textarea id="bulk" placeholder="cat = Katze&#10;dog = Hund"></textarea><input id="bu" placeholder="Unit" value="Unit 1"><button class="p" onclick="bulkW()">Importieren</button></div>
  <h2>Alle Wörter (${S.words.length})</h2>`+S.words.map(w=>`<div class="row"><span>${esc(w.en)} – ${esc(w.de)} <span class="mu">· ${esc(w.unit)}</span></span><button onclick="delW(${w.id})" aria-label="Löschen">🗑</button></div>`).join("");
}
function addW(){const e=$("#ne").value.trim(),d=$("#nd").value.trim();if(!e||!d)return;S.words.push({id:Date.now()+Math.random(),en:e,de:d,unit:$("#nu").value.trim()||"Eigene",box:0,ok:0,bad:0});save();render()}
function bulkW(){const u=$("#bu").value.trim()||"Eigene";$("#bulk").value.split("\n").forEach(l=>{const p=l.split(/\s*[=\t;]\s*/);if(p.length>=2&&p[0]&&p[1])S.words.push({id:Date.now()+Math.random(),en:p[0].trim(),de:p[1].trim(),unit:u,box:0,ok:0,bad:0})});save();render()}
function delW(id){S.words=S.words.filter(w=>w.id!=id);V.w=null;save();render()}

function einstellungen(){
  return `<h1>Einstellungen</h1>`+ausseh()+sicherung().replace("<h1>Sicherung</h1>","<h2>Sicherung</h2>")+woerter().replace("<h1>Wörter</h1>","<h2>Wörter</h2>");
}
function sicherung(){
  return `<h1>Sicherung</h1><div class="card"><b>Daten sichern</b><p class="mu">Alles liegt nur auf diesem Gerät. Kopiere den Text und speichere ihn z. B. in einer Notiz.</p><textarea id="ex" readonly>${esc(JSON.stringify(S))}</textarea><button class="p" onclick="cp()">Kopieren</button></div>
  <div class="card"><b>Wiederherstellen</b><textarea id="im" placeholder="Gesicherten Text hier einfügen"></textarea><button class="p" onclick="imp()">Wiederherstellen</button><p id="msg"></p></div>`;
}
function cp(){const t=$("#ex");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand("copy")}catch(x){}}}
function imp(){try{const d=JSON.parse($("#im").value);if(!d||!Array.isArray(d.words))throw 0;S=d;S.st=S.st||{};S.pts=S.pts||0;V.w=null;save();$("#msg").textContent="Wiederhergestellt ✅"}catch(e){$("#msg").textContent="Das hat nicht geklappt. Ist der ganze Text eingefügt?"}}
const COL={blau:["#2f6fed","#6b9bff","Blau"],gruen:["#1f9d55","#43c47c","Grün"],lila:["#7c4dff","#a98bff","Lila"],pink:["#e0409a","#ff7cc4","Pink"],orange:["#e8720c","#ffa14d","Orange"]};
const LOGO=`<svg width="60" height="60" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="English Trainer"><defs><clipPath id="lc"><circle cx="256" cy="236" r="196"/></clipPath><clipPath id="lt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath></defs><rect width="512" height="512" rx="96" fill="#8fd0ff"/><g clip-path="url(#lc)"><g transform="translate(-137 39.5) scale(13.1)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#lt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></g><circle cx="256" cy="236" r="196" fill="none" stroke="#1b1b1b" stroke-width="14"/><path d="M232 418V462M292 418V462M212 466H254M272 466H314" stroke="#f08a00" stroke-width="15" stroke-linecap="round" fill="none"/><g stroke="#1b1b1b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M150 360L92 408L196 398Z" fill="#d9e2ec"/><ellipse cx="256" cy="330" rx="112" ry="96" fill="#fff"/><path d="M168 296C146 380 226 424 306 398C254 376 238 336 248 286Z" fill="#b8c6d6"/><circle cx="304" cy="206" r="70" fill="#fff"/><path d="M360 208L438 230L362 252Z" fill="#ffb300"/><circle cx="322" cy="192" r="24" fill="#fff" stroke-width="7"/></g><circle cx="290" cy="238" r="14" fill="#ffb3c7" opacity=".85"/><circle cx="330" cy="194" r="10" fill="#1b1b1b"/><circle cx="334" cy="189" r="4" fill="#fff"/><path d="M420 225L438 230L424 237Z" fill="#e53935"/><path d="M300 166Q322 154 346 168" stroke="#1b1b1b" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`;
const TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window};
let VOICES=[];
function loadVoices(){if(!TTS.ok)return;try{VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}}
if(TTS.ok){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(location.hash=="#einstellungen")render()}}catch(e){}}
function bestVoice(){
  const n=S.set.voice;if(n){const v=VOICES.find(x=>x.name==n);if(v)return v}
  const sc=v=>(/en[-_]GB/i.test(v.lang)?100:10)+(/premium|enhanced|erweitert|siri/i.test(v.name)?20:0)+(v.localService?1:0);
  return [...VOICES].sort((a,b)=>sc(b)-sc(a))[0]||null;
}
function spk(t){
  return String(t).replace(/\([^)]*\)/g," ").replace(/___+/g," … ").replace(/\b(\d{1,2}):(\d{2})\b/g,(m,h,mi)=>{h=+h;mi=+mi;return mi%5==0?tw(h%12||12,mi):m}).replace(/°C/g," degrees").replace(/\s+/g," ").trim();
}
function say(t,slow){
  if(!TTS.ok||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spk(t)),v=bestVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";
    u.rate=Math.max(0.3,(S.set.rate||0.9)*(slow?0.65:1));speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){}
}
function sayQ(){
  const q=Q.qs[Q.i];if(!q)return;const done=Q.sel!=null;
  const t=q.say||(done&&q.spA)||(q.sp?q.sp.replace(/___+/g,done?q.a:"blank"):"");
  if(t)say(t);
}
function spkBtn(q){const done=Q.sel!=null;return(!q.dict&&!q.listen&&(q.sp||(done&&q.spA)))?` <button class="spk" onclick="sayQ()" aria-label="Vorlesen">🔊</button>`:""}
function listenRow(q){
  if(q.dict&&Q.sel!=null)return `<div style="margin:8px 0"><button onclick="sayQ()">🔊 Nochmal hören</button></div>`;
  if(q.listen||q.dict){
    const n=String(q.a).split(" ").length;
    return `<div style="margin:8px 0"><button class="p" onclick="sayQ()">🔊 Anhören</button><button onclick="say(Q.qs[Q.i].say,1)">🐢 Langsam</button>${q.dict?`<button onclick="Q.h=1;render()">💡 Tipp</button>`:""}</div>${q.dict&&Q.h?`<p class="mu">Tipp: ${esc(String(q.a).slice(0,1))} … (${n} ${n>1?"Wörter":"Wort"}, ${String(q.a).length} Zeichen)</p>`:""}`;
  }
  return "";
}
function nxt(){Q.i++;Q.sel=null;Q.h=0;render();const q=Q.qs[Q.i];if(q&&(q.dict||q.listen))say(q.say)}
function setSet(k,v,nr){S.set[k]=k=="rate"?parseFloat(v):v;save();applyTheme();if(!nr)render()}
function applyTheme(){
  const s=S.set||{},r=document.documentElement,dm=matchMedia("(prefers-color-scheme: dark)").matches,m=s.mode||"auto",dark=m=="dark"||(m=="auto"&&dm);
  if(m=="light"||m=="dark")r.setAttribute("data-theme",m);else r.removeAttribute("data-theme");
  const c=COL[s.color]||COL.blau;r.style.setProperty("--pr",dark?c[1]:c[0]);
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?"#10141d":"#f4f7fc";
}
function ausseh(){
  const s=S.set;
  let h=`<h2>Aussehen</h2><div class="card"><b>Helligkeit</b><br>`+[["auto","Automatisch"],["light","Hell"],["dark","Dunkel"]].map(a=>`<button class="${s.mode==a[0]?"on":""}" onclick="setSet('mode','${a[0]}')">${a[1]}</button>`).join("")+`<br><b>Farbe</b><br>`+Object.keys(COL).map(k=>`<button class="colb ${s.color==k?"on":""}" style="border-color:${COL[k][0]}" onclick="setSet('color','${k}')"><i style="background:${COL[k][0]}"></i>${COL[k][2]}</button>`).join("")+`</div><h2>Vorlesen</h2><div class="card">`;
  if(!TTS.ok)return h+`Dieses Gerät kann leider nicht vorlesen.</div>`;
  const vo=VOICES.map(v=>`<option value="${esc(v.name)}"${s.voice==v.name?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  return h+`<b>Stimme</b><select onchange="setSet('voice',this.value)"><option value="">Automatisch (beste britische Stimme)</option>${vo}</select><b>Tempo</b><input type="range" min="0.5" max="1.2" step="0.05" value="${s.rate}" oninput="setSet('rate',this.value,1)"><label class="chk"><input type="checkbox" ${s.auto?"checked":""} onchange="setSet('auto',this.checked)"><span>Automatisch vorlesen</span></label><button class="p" onclick="say('Hello Mia! This is my voice.')">🔊 Probe</button><button onclick="loadVoices();render()">Stimmen neu laden</button><p class="mu">Tipp für bessere Stimmen: Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Englisch (Großbritannien) → eine Stimme mit „Erweitert“ laden.</p></div>`;
}
function errRec(q,g){
  if(q.id||q.ov)return;
  S.err=S.err||[];
  const key=(q.q||"")+"|"+q.a;let it=S.err.find(x=>x.key==key);
  if(it){
    if(g){it.ok=(it.ok||0)+1;if(it.ok>=2)S.err=S.err.filter(x=>x!==it)}else it.ok=0;
  }else if(!g&&!Q.er){
    S.err.push({key,q:q.q,a:q.a,o:q.opts,e:q.e,k:q.k,ty:q.ty,acc:q.acc,vis:q.vis,sp:q.sp,spA:q.spA,say:q.say,dict:q.dict,listen:q.listen,ok:0});
    if(S.err.length>150)S.err.shift();
  }
  save();
}
function errGo(n){start(sh(S.err||[]).slice(0,n).map(it=>({...it,opts:it.ty?[]:sh(it.o||[])})),"Meine Fehler",1)}
function fehler(){
  const n=(S.err||[]).length,hw=S.words.filter(w=>w.bad>w.ok).length;
  let h=`<h1>Meine Fehler 🔁</h1>`;
  if(!n&&!hw)return h+`<div class="card">Keine Fehler – super gemacht! 🎉<br><span class="mu">Sobald etwas falsch war, taucht es hier auf. Nach zwei richtigen Antworten verschwindet es wieder.</span></div>`;
  h+=`<div class="card"><b>Fragen</b><p class="mu">${n?n+" Frage(n) zum Wiederholen":"Keine Fragen offen."}</p>${n?`<button class="p" onclick="errGo(10)">10 üben</button><button onclick="errGo(30)">30 üben</button>`:""}</div>`;
  h+=`<div class="card"><b>Wörter</b><p class="mu">${hw?hw+" Wörter, die noch nicht sicher sind":"Keine unsicheren Wörter."}</p>${hw?`<button class="p" onclick="V.unit='hardall';V.w=null;location.hash='#vokabeln'">Wörter üben</button>`:""}</div>`;
  return h;
}
function dq(t,e){return{q:"Höre zu und schreibe auf.",say:t,dict:1,ty:1,a:t,acc:[t],opts:[],e,k:"g:Hören"}}
function hrGo(kind,n){
  const W=WP().filter(w=>/^[A-Za-z' -]{2,22}$/.test(w.en));let qs=[];
  if(kind=="dw")qs=sh(W).slice(0,n).map(w=>dq(w.en,`Richtig: ${w.en} (${w.de.split("/")[0]})`));
  else if(kind=="ds"){
    const L=[...TRU().map(x=>x[1][0]),...WOU().map(x=>x[1][0])].filter(t=>t.split(" ").length>2&&!/[0-9:]/.test(t));
    qs=sh(L).slice(0,n).map(t=>dq(t,`Richtig: ${t}`));
  }else{
    qs=sh(W).slice(0,n).map((w,i)=>{
      const c=w.de.split("/")[0];let q;
      if(i%2==0)q=mk("Was bedeutet das Wort, das du hörst?",c,pk(W.filter(x=>x.en!=w.en),x=>x.de.split("/")[0],c),`${w.en} = ${w.de}`,"g:Hören");
      else q=mk("Wie schreibt man das Wort, das du hörst?",w.en,pk(W.filter(x=>x.en!=w.en),x=>x.en,w.en),`${w.en} = ${w.de}`,"g:Hören");
      q.say=w.en;q.listen=1;return q;
    });
  }
  start(qs,"Hören");
}
function hoeren(){
  if(!TTS.ok)return `<h1>Hören 🎧</h1><div class="card">Dieses Gerät kann leider nicht vorlesen.</div>`;
  return `<h1>Hören 🎧</h1><p class="mu">Mia hört ein englisches Wort oder einen Satz. Ton am Gerät anmachen und den Stummschalter ausschalten. Die Inhalte richten sich nach den gewählten Units und Seiten.</p>
  <h2>Hören und schreiben</h2><button class="p" onclick="hrGo('dw',10)">Wörter (10)</button><button class="p" onclick="hrGo('ds',8)">Sätze (8)</button>
  <h2>Hören und auswählen</h2><button class="p" onclick="hrGo('mc',10)">10 Fragen</button><button class="p" onclick="hrGo('mc',20)">20 Fragen</button>
  <h2>Stimme testen</h2><button onclick="say('Hello Mia! Let us practise English.')">🔊 Probe</button>`;
}
const GCOST=35;
function getPts(){return Math.max(0,(S.pts||0)-(S.sp||0))}
function spendPts(n){S.sp=Math.max(0,(S.sp||0)+n);save()}
function leaveGames(){location.hash="#home"}
function subNav(a){return `<div style="margin:6px 0 12px"><a class="btn ${a=="fortschritt"?"p":""}" href="#fortschritt">Übersicht</a><a class="btn ${a=="einloesen"?"p":""}" href="#einloesen">🎮 Punkte einlösen</a></div>`}
function einloesen(){
  const p=getPts(),n=Math.floor(p/GCOST);
  return `<h1>Fortschritt</h1>${subNav("einloesen")}<div class="card"><b>🎮 Punkte einlösen</b><p class="mu">Ein Minispiel kostet ${GCOST} ⭐. Du hast <b>${p} ⭐</b>${n?` und kannst ${n} Spiel${n>1?"e":""} spielen.`:`. Dir fehlen noch ${GCOST-p} ⭐, sammle sie mit Aufgaben.`}</p></div><iframe id="mg" src="spiele.html" title="Minispiele" style="width:100%;height:82vh;min-height:540px;border:0;border-radius:14px;background:var(--card)"></iframe>`;
}
let LA=Date.now(),TS=0;
["click","keydown","touchstart","scroll","mousemove"].forEach(e=>addEventListener(e,()=>{LA=Date.now()},{passive:true}));
setInterval(()=>{
  if(document.visibilityState!=="visible"||Date.now()-LA>120000)return;
  S.t=S.t||{};const k=dk(new Date());S.t[k]=(S.t[k]||0)+5;
  if(++TS%6==0)save();
  const el=document.getElementById("tt");if(el)el.innerHTML=ttxt();
},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});
applyTheme();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
